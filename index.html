<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整点儿玄的 - 一站式东西方命理占卜平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.13/lunar.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#7c3aed', secondary: '#a855f7', accent: '#ec4899', dark: '#0f172a', darker: '#020617', card: '#1e293b' },
                    fontFamily: { serif: ['Noto Serif SC', 'serif'] },
                    animation: {
                        'float': 'float 6s ease-in-out infinite', 'glow': 'glow 2s ease-in-out infinite alternate',
                        'flip': 'flip 0.8s ease-in-out forwards', 'fadeIn': 'fadeIn 0.5s ease-in-out',
                        'slideUp': 'slideUp 0.5s ease-out', 'pageFlip': 'pageFlip 1.2s ease-in-out forwards',
                        'spinCoin': 'spinCoin 1.5s ease-in-out forwards',
                    },
                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
                        glow: { from: { boxShadow: '0 0 20px #7c3aed40' }, to: { boxShadow: '0 0 30px #7c3aed80, 0 0 40px #7c3aed40' } },
                        flip: { '0%': { transform: 'rotateY(0deg)' }, '100%': { transform: 'rotateY(180deg)' } },
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        pageFlip: { '0%': { transform: 'rotateY(0deg)' }, '100%': { transform: 'rotateY(-180deg)' } },
                        spinCoin: { '0%': { transform: 'rotateY(0deg) rotateX(0deg)' }, '50%': { transform: 'rotateY(720deg) rotateX(360deg)' }, '100%': { transform: 'rotateY(0deg) rotateX(0deg)' } }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient { background-clip: text; -webkit-background-clip: text; color: transparent; background-image: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%); }
            .bg-gradient-main { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%); }
            .card-hover { transition: all 0.3s ease; }
            .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(124, 58, 237, 0.1), 0 10px 10px -5px rgba(124, 58, 237, 0.04); }
            .tarot-card { perspective: 1500px; } .tarot-card-inner { transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
            .tarot-card.flipped .tarot-card-inner { transform: rotateY(180deg); } .tarot-card-front, .tarot-card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; } .tarot-card-back { transform: rotateY(180deg); }
            .lenormand-card { perspective: 1000px; } .lenormand-card-inner { transition: transform 0.6s ease; transform-style: preserve-3d; }
            .lenormand-card.flipped .lenormand-card-inner { transform: rotateY(180deg); } .lenormand-card-front, .lenormand-card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; } .lenormand-card-back { transform: rotateY(180deg); }
            .book-container { perspective: 2000px; } .book-page { transform-origin: left center; transform-style: preserve-3d; transition: transform 1.2s ease-in-out; }
            .book-page.flipped { transform: rotateY(-180deg); } .book-front, .book-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; } .book-back { transform: rotateY(180deg); }
            .copper-coin { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #d4a017, #b8860b); box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,200,0.5); display: flex; align-items: center; justify-content: center; position: relative; }
            .copper-coin::after { content: ""; position: absolute; width: 24px; height: 24px; background: #3a2c0a; border: 2px solid #8b6508; transform: rotate(45deg); }
            .coin-text { font-family: 'KaiTi', '楷体', serif; font-size: 36px; font-weight: bold; color: #3a2c0a; position: relative; z-index: 1; }
        }
    </style>
</head>
<body class="bg-gradient-main min-h-screen text-gray-100 font-serif">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute w-1 h-1 bg-white rounded-full top-[10%] left-[20%] animate-pulse"></div>
        <div class="absolute w-1 h-1 bg-white rounded-full top-[15%] left-[80%] animate-pulse" style="animation-delay: 0.5s"></div>
        <div class="absolute w-2 h-2 bg-white rounded-full top-[30%] left-[40%] animate-pulse" style="animation-delay: 1s"></div>
        <div class="absolute w-1 h-1 bg-white rounded-full top-[45%] left-[70%] animate-pulse" style="animation-delay: 1.5s"></div>
        <div class="absolute w-1 h-1 bg-white rounded-full top-[60%] left-[10%] animate-pulse" style="animation-delay: 2s"></div>
        <div class="absolute w-2 h-2 bg-white rounded-full top-[75%] left-[50%] animate-pulse" style="animation-delay: 0.3s"></div>
        <div class="absolute w-1 h-1 bg-white rounded-full top-[85%] left-[30%] animate-pulse" style="animation-delay: 0.8s"></div>
        <div class="absolute w-1 h-1 bg-white rounded-full top-[20%] left-[60%] animate-pulse" style="animation-delay: 1.2s"></div>
    </div>

    <nav class="bg-darker/80 backdrop-blur-md shadow-lg sticky top-0 z-50 border-b border-primary/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center"><span class="text-2xl font-bold text-gradient animate-glow"><i class="fa fa-moon-o mr-2"></i>整点儿玄的</span></div>
                <div class="flex items-center"><span class="text-sm text-gray-400 bg-primary/10 px-3 py-1 rounded-full">仅供娱乐参考</span></div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10">
        <div class="bg-yellow-500/10 border-l-4 border-yellow-500 p-4 mb-8 rounded-r-lg animate-fadeIn">
            <div class="flex"><div class="flex-shrink-0"><i class="fa fa-exclamation-triangle text-yellow-500 text-xl"></i></div><div class="ml-3"><p class="text-sm text-yellow-200"><strong>重要声明：</strong>本网站所有内容仅供娱乐休闲和传统文化交流使用，不构成任何人生决策建议。</p></div></div>
        </div>
        <div class="mb-10">
            <div class="flex flex-wrap gap-3 justify-center">
                <button onclick="showTool('tarot')" class="tool-tab active px-5 py-3 rounded-full bg-primary text-white font-medium transition-all hover:bg-primary/90 card-hover"><i class="fa fa-magic mr-2"></i>塔罗牌</button>
                <button onclick="showTool('lenormand')" class="tool-tab px-5 py-3 rounded-full bg-card text-gray-300 font-medium transition-all hover:bg-card/80 card-hover"><i class="fa fa-diamond mr-2"></i>雷诺曼</button>
                <button onclick="showTool('bazi')" class="tool-tab px-5 py-3 rounded-full bg-card text-gray-300 font-medium transition-all hover:bg-card/80 card-hover"><i class="fa fa-calendar mr-2"></i>八字排盘</button>
                <button onclick="showTool('bazi-hepan')" class="tool-tab px-5 py-3 rounded-full bg-card text-gray-300 font-medium transition-all hover:bg-card/80 card-hover"><i class="fa fa-heart mr-2"></i>八字合盘</button>
                <button onclick="showTool('liuyao')" class="tool-tab px-5 py-3 rounded-full bg-card text-gray-300 font-medium transition-all hover:bg-card/80 card-hover"><i class="fa fa-yen mr-2"></i>六爻占卜</button>
                <button onclick="showTool('meihua')" class="tool-tab px-5 py-3 rounded-full bg-card text-gray-300 font-medium transition-all hover:bg-card/80 card-hover"><i class="fa fa-leaf mr-2"></i>梅花易数</button>
                <button onclick="showTool('answers')" class="tool-tab px-5 py-3 rounded-full bg-card text-gray-300 font-medium transition-all hover:bg-card/80 card-hover"><i class="fa fa-book mr-2"></i>答案之书</button>
            </div>
        </div>

        <!-- 塔罗牌 -->
        <div id="tarot-tool" class="tool-content animate-slideUp">
            <div class="bg-card rounded-2xl shadow-2xl p-8 mb-8 border border-primary/20 card-hover">
                <h2 class="text-3xl font-bold text-center mb-8 text-gradient"><i class="fa fa-magic mr-3"></i>塔罗牌占卜</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div><label class="block text-gray-300 font-medium mb-3 text-lg">选择牌阵：</label><select id="tarot-spread" class="w-full p-4 bg-darker border border-primary/30 rounded-xl text-white"><option value="single">单张牌</option><option value="three">三牌阵</option><option value="cross">十字牌阵</option><option value="celtic">凯尔特十字</option></select></div>
                    <div><label class="block text-gray-300 font-medium mb-3 text-lg">问题类型：</label><select id="tarot-category" class="w-full p-4 bg-darker border border-primary/30 rounded-xl text-white"><option value="general">综合运势</option><option value="love">感情爱情</option><option value="career">事业学业</option><option value="wealth">财运健康</option></select></div>
                </div>
                <div class="mb-8"><label class="block text-gray-300 font-medium mb-3 text-lg">默念问题：</label><textarea id="tarot-question" rows="2" class="w-full p-4 bg-darker border border-primary/30 rounded-xl text-white" placeholder="例如：我的钥匙丢在哪了？"></textarea></div>
                <button onclick="drawTarot()" class="w-full bg-gradient-to-r from-primary to-secondary text-white font-bold py-4 px-6 rounded-xl hover:opacity-90 text-lg shadow-lg"><i class="fa fa-hand-paper-o mr-2"></i>开始抽牌</button>
            </div>
            <div id="tarot-result" class="bg-card rounded-2xl shadow-2xl p-8 border border-primary/20 hidden animate-slideUp"><h3 class="text-2xl font-bold mb-8 text-center text-gradient">占卜结果</h3><div id="tarot-cards" class="flex flex-wrap justify-center gap-6 mb-10"></div><div id="tarot-interpretation" class="prose prose-invert max-w-none"></div></div>
        </div>

        <!-- 雷诺曼 -->
        <div id="lenormand-tool" class="tool-content hidden animate-slideUp">
            <div class="bg-card rounded-2xl shadow-2xl p-8 mb-8 border border-primary/20 card-hover">
                <h2 class="text-3xl font-bold text-center mb-8 text-gradient"><i class="fa fa-diamond mr-3"></i>雷诺曼牌占卜</h2>
                <div class="mb-8"><label class="block text-gray-300 font-medium mb-3 text-lg">选择牌阵：</label><select id="lenormand-spread" class="w-full p-4 bg-darker border border-primary/30 rounded-xl text-white"><option value="single">单张牌</option><option value="three">三牌阵</option><option value="five">五牌阵</option><option value="nine">九宫格</option></select></div>
                <div class="mb-8"><label class="block text-gray-300 font-medium mb-3 text-lg">默念问题：</label><textarea id="lenormand-question" rows="2" class="w-full p-4 bg-darker border border-primary/30 rounded-xl text-white" placeholder="例如：我的钱包丢在哪了？"></textarea></div>
                <button onclick="drawLenormand()" class="w-full bg-gradient-to-r from-primary to-secondary text-white font-bold py-4 px-6 rounded-xl hover:opacity-90 text-lg shadow-lg"><i class="fa fa-hand-paper-o mr-2"></i>开始抽牌</button>
            </div>
            <div id="lenormand-result" class="bg-card rounded-2xl shadow-2xl p-8 border border-primary/20 hidden animate-slideUp"><h3 class="text-2xl font-bold mb-8 text-center text-gradient">雷诺曼占卜结果</h3><div id="lenormand-cards" class="flex flex-wrap justify-center gap-4 mb-10"></div><div id="lenormand-interpretation" class="prose prose-invert max-w-none"></div></div>
        </div>

        <!-- 八字排盘 -->
        <div id="bazi-tool" class="tool-content hidden animate-slideUp">
            <div class="bg-card rounded-2xl shadow-2xl p-8 mb-8 border border-primary/20 card-hover">
                <h2 class="text-3xl font-bold text-center mb-8 text-gradient"><i class="fa fa-calendar mr-3"></i>八字排盘（公历转农历）</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div><label class="block text-gray-300 font-medium mb-3 text-lg">公历日期：</label><input type="date" id="bazi-date" class="w-full p-4 bg-darker border border-primary/30 rounded-xl text-white"></div>
                    <div><label class="block text-gray-300 font-medium mb-3 text-lg">出生时间：</label><input type="time" id="bazi-time" class="w-full p-4 bg-darker border border-primary/30 rounded-xl text-white"></div>
                </div>
                <div class="mb-8"><label class="block text-gray-300 font-medium mb-3 text-lg">性别：</label><div class="flex gap-8"><label class="flex items-center text-lg"><input type="radio" name="bazi-gender" value="male" checked class="mr-3 w-5 h-5 text-primary"> 男</label><label class="flex items-center text-lg"><input type="radio" name="bazi-gender" value="female" class="mr-3 w-5 h-5 text-primary"> 女</label></div></div>
                <button onclick="calculateBazi()" class="w-full bg-gradient-to-r from-primary to-secondary text-white font-bold py-4 px-6 rounded-xl hover:opacity-90 text-lg shadow-lg"><i class="fa fa-calculator mr-2"></i>开始排盘</button>
            </div>
            <div id="bazi-result" class="bg-card rounded-2xl shadow-2xl p-8 border border-primary/20 hidden animate-slideUp"><h3 class="text-2xl font-bold mb-8 text-center text-gradient">你的八字命盘</h3><div id="bazi-chart" class="mb-10"></div><div id="bazi-analysis" class="prose prose-invert max-w-none"></div></div>
        </div>

        <!-- 八字合盘 -->
        <div id="bazi-hepan-tool" class="tool-content hidden animate-slideUp">
            <div class="bg-card rounded-2xl shadow-2xl p-8 mb-8 border border-primary/20 card-hover"><h2 class="text-3xl font-bold text-center mb-8 text-gradient"><i class="fa fa-heart mr-3"></i>八字合盘</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8"><div class="bg-darker/30 p-6 rounded-xl"><h4 class="text-xl font-bold mb-4 text-primary">你的信息</h4><div class="space-y-4"><div><label class="block text-gray-300 font-medium mb-2">公历日期：</label><input type="date" id="hepan1-date" class="w-full p-3 bg-darker border border-primary/30 rounded-lg text-white"></div><div><label class="block text-gray-300 font-medium mb-2">出生时间：</label><input type="time" id="hepan1-time" class="w-full p-3 bg-darker border border-primary/30 rounded-lg text-white"></div><div><label class="block text-gray-300 font-medium mb-2">性别：</label><div class="flex gap-4"><label class="flex items-center"><input type="radio" name="hepan1-gender" value="male" checked class="mr-2 w-4 h-4 text-primary"> 男</label><label class="flex items-center"><input type="radio" name="hepan1-gender" value="female" class="mr-2 w-4 h-4 text-primary"> 女</label></div></div></div></div><div class="bg-darker/30 p-6 rounded-xl"><h4 class="text-xl font-bold mb-4 text-accent">对方信息</h4><div class="space-y-4"><div><label class="block text-gray-300 font-medium mb-2">公历日期：</label><input type="date" id="hepan2-date" class="w-full p-3 bg-darker border border-primary/30 rounded-lg text-white"></div><div><label class="block text-gray-300 font-medium mb-2">出生时间：</label><input type="time" id="hepan2-time" class="w-full p-3 bg-darker border border-primary/30 rounded-lg text-white"></div><div><label class="block text-gray-300 font-medium mb-2">性别：</label><div class="flex gap-4"><label class="flex items-center"><input type="radio" name="hepan2-gender" value="male" class="mr-2 w-4 h-4 text-primary"> 男</label><label class="flex items-center"><input type="radio" name="hepan2-gender" value="female" checked class="mr-2 w-4 h-4 text-primary"> 女</label></div></div></div></div></div><button onclick="calculateBaziHepan()" class="w-full bg-gradient-to-r from-primary to-accent text-white font-bold py-4 px-6 rounded-xl hover:opacity-90 text-lg shadow-lg"><i class="fa fa-heart mr-2"></i>开始合盘</button></div>
            <div id="bazi-hepan-result" class="bg-card rounded-2xl shadow-2xl p-8 border border-primary/20 hidden animate-slideUp"><h3 class="text-2xl font-bold mb-8 text-center text-gradient">八字合盘结果</h3><div id="bazi-hepan-score" class="mb-10 text-center"></div><div id="bazi-hepan-analysis" class="prose prose-invert max-w-none"></div></div>
        </div>

        <!-- 六爻占卜 -->
        <div id="liuyao-tool" class="tool-content hidden animate-slideUp">
            <div class="bg-card rounded-2xl shadow-2xl p-8 mb-8 border border-primary/20 card-hover">
                <h2 class="text-3xl font-bold text-center mb-8 text-gradient"><i class="fa fa-yen mr-3"></i>六爻占卜</h2>
                <div class="mb-8"><label class="block text-gray-300 font-medium mb-3 text-lg">默念占卜问题：</label><textarea id="liuyao-question" rows="2" class="w-full p-4 bg-darker border border-primary/30 rounded-xl text-white" placeholder="例如：我的手机丢在哪了？"></textarea></div>
                <div class="flex justify-center gap-10 mb-8">
                    <div id="coin1" class="copper-coin coin"><span class="coin-text">⚊</span></div>
                    <div id="coin2" class="copper-coin coin"><span class="coin-text">⚊</span></div>
                    <div id="coin3" class="copper-coin coin"><span class="coin-text">⚊</span></div>
                </div>
                <p class="text-center text-gray-400 mb-6 text-lg">已摇：<span id="yao-count" class="text-primary font-bold">0</span>/6 次</p>
                <button onclick="tossCoins()" id="toss-btn" class="w-full bg-gradient-to-r from-primary to-secondary text-white font-bold py-4 px-6 rounded-xl hover:opacity-90 text-lg shadow-lg"><i class="fa fa-refresh mr-2"></i>摇卦</button>
            </div>
            <div id="liuyao-result" class="bg-card rounded-2xl shadow-2xl p-8 border border-primary/20 hidden animate-slideUp"><h3 class="text-2xl font-bold mb-8 text-center text-gradient">六爻卦象结果</h3><div id="liuyao-chart" class="mb-10 text-center"></div><div id="liuyao-interpretation" class="prose prose-invert max-w-none"></div></div>
        </div>

        <!-- 梅花易数（文字起卦已修复） -->
        <div id="meihua-tool" class="tool-content hidden animate-slideUp">
            <div class="bg-card rounded-2xl shadow-2xl p-8 mb-8 border border-primary/20 card-hover">
                <h2 class="text-3xl font-bold text-center mb-8 text-gradient"><i class="fa fa-leaf mr-3"></i>梅花易数</h2>
                <div class="mb-8"><label class="block text-gray-300 font-medium mb-3 text-lg">起卦方式：</label><select id="meihua-method" class="w-full p-4 bg-darker border border-primary/30 rounded-xl text-white"><option value="number">数字起卦</option><option value="time">时间起卦</option><option value="text">文字起卦</option></select></div>
                <div id="number-input" class="mb-8">
                    <label class="block text-gray-300 font-medium mb-3 text-lg">输入两个数字（1-99）：</label>
                    <div class="grid grid-cols-2 gap-6"><input type="number" id="num1" min="1" max="99" class="w-full p-4 bg-darker border border-primary/30 rounded-xl text-white" placeholder="第一个数字"><input type="number" id="num2" min="1" max="99" class="w-full p-4 bg-darker border border-primary/30 rounded-xl text-white" placeholder="第二个数字"></div>
                </div>
                <div id="text-input" class="mb-8 hidden">
                    <label class="block text-gray-300 font-medium mb-3 text-lg">输入你要占卜的文字：</label>
                    <input type="text" id="meihua-text" class="w-full p-4 bg-darker border border-primary/30 rounded-xl text-white" placeholder="输入文字，会根据笔画数自动起卦">
                </div>
                <button onclick="calculateMeihua()" class="w-full bg-gradient-to-r from-primary to-secondary text-white font-bold py-4 px-6 rounded-xl hover:opacity-90 text-lg shadow-lg"><i class="fa fa-leaf mr-2"></i>起卦</button>
            </div>
            <div id="meihua-result" class="bg-card rounded-2xl shadow-2xl p-8 border border-primary/20 hidden animate-slideUp"><h3 class="text-2xl font-bold mb-8 text-center text-gradient">梅花易数卦象结果</h3><div id="meihua-chart" class="mb-10 text-center"></div><div id="meihua-interpretation" class="prose prose-invert max-w-none"></div></div>
        </div>

        <!-- 答案之书 -->
        <div id="answers-tool" class="tool-content hidden animate-slideUp">
            <div class="bg-card rounded-2xl shadow-2xl p-8 mb-8 border border-primary/20 card-hover"><h2 class="text-3xl font-bold text-center mb-8 text-gradient"><i class="fa fa-book mr-3"></i>答案之书</h2><div class="mb-8"><label class="block text-gray-300 font-medium mb-3 text-lg">默念一个是/否问题：</label><textarea id="answer-question" rows="2" class="w-full p-4 bg-darker border border-primary/30 rounded-xl text-white" placeholder="例如：我应该接受这份工作吗？"></textarea></div><div class="flex justify-center mb-8 book-container"><div id="answer-book" class="w-72 h-96 relative cursor-pointer hover:scale-105 transition-transform" onclick="getAnswer()"><div class="book-page absolute w-full h-full"><div class="book-front absolute w-full h-full bg-gradient-to-br from-indigo-800 to-purple-900 rounded-lg shadow-2xl flex items-center justify-center border-4 border-primary/30"><div class="text-white text-center p-8"><i class="fa fa-book text-7xl mb-6 text-gradient"></i><p class="text-2xl font-bold">点击翻开答案</p><p class="text-sm text-gray-300 mt-2">心诚则灵</p></div></div><div class="book-back absolute w-full h-full bg-gradient-to-br from-gray-100 to-gray-200 rounded-lg shadow-2xl flex items-center justify-center border-4 border-primary/30"><div id="answer-content" class="text-center p-8"><p id="answer-text-display" class="text-2xl font-bold text-primary"></p></div></div></div></div></div></div>

        function getTextStrokes(text) {
            let total = 0;
            for (let ch of text) {
                // 中文字符粗略估算笔画：Unicode范围基本汉字，取随机笔画1-20作为模拟
                // 实际应用中应使用笔画库，这里用charCodeAt取模模拟
                if (/[\u4e00-\u9fff]/.test(ch)) {
                    total += (ch.charCodeAt(0) % 20) + 1;
                } else {
                    total += 1;
                }
            }
            return total || 1;
        }

            '庚午':'路旁土','辛未':'路旁土','壬申':'剑锋金','癸酉':'剑锋金','甲戌':'山头火','乙亥':'山头火',

            '丙午':'天河水','丁未':'天河水','戊申':'大驿土','己酉':'大驿土','庚戌':'钗钏金','辛亥':'钗钏金',
            '壬子':'桑柘木','癸丑':'桑柘木','甲寅':'大溪水','乙卯':'大溪水','丙辰':'沙中土','丁巳':'沙中土',
            '戊午':'天上火','己未':'天上火','庚申':'石榴木','辛酉':'石榴木','壬戌':'大海水','癸亥':'大海水'
        };
        function getNaYin(gz) { return naYinMap[gz] || '未知'; }
        function getShiZhu(dayGanChar, hour) {
            const dayGanIdx = tianGan.indexOf(dayGanChar);
            const shiZhiIdx = Math.floor((hour + 1) / 2) % 12;
            const startTianGan = (dayGanIdx % 5) * 2;
            const shiTianGanIdx = (startTianGan + shiZhiIdx) % 10;
            return tianGan[shiTianGanIdx] + diZhi[shiZhiIdx];
        }
        function calculateBazi() {
            const dateStr = document.getElementById('bazi-date').value;
            const timeStr = document.getElementById('bazi-time').value;
            const gender = document.querySelector('input[name="bazi-gender"]:checked').value;
            if (!dateStr) { alert('请选择出生日期'); return; }
            try {
                const [year, month, day] = dateStr.split('-').map(Number);
                const hour = timeStr ? parseInt(timeStr.split(':')[0]) : 12;
                const solar = Solar.fromYmd(year, month, day);
                const lunar = solar.getLunar();
                const bazi = lunar.getEightChar();
                const yearZhu = bazi.getYear();
                const monthZhu = bazi.getMonth();
                const dayZhu = bazi.getDay();
                const shiZhu = getShiZhu(dayZhu.charAt(0), hour);
                const riGan = dayZhu.charAt(0);
                const naYin = [getNaYin(yearZhu), getNaYin(monthZhu), getNaYin(dayZhu), getNaYin(shiZhu)];
                const wx = {木:0,火:0,土:0,金:0,水:0};
                [yearZhu, monthZhu, dayZhu, shiZhu].forEach(z => {
                    '甲乙寅卯'.includes(z[0])?wx.木++:0; '丙丁巳午'.includes(z[0])?wx.火++:0; '戊己辰戌丑未'.includes(z[0])?wx.土++:0; '庚辛申酉'.includes(z[0])?wx.金++:0; '壬癸亥子'.includes(z[0])?wx.水++:0;
                    '甲乙寅卯'.includes(z[1])?wx.木++:0; '丙丁巳午'.includes(z[1])?wx.火++:0; '戊己辰戌丑未'.includes(z[1])?wx.土++:0; '庚辛申酉'.includes(z[1])?wx.金++:0; '壬癸亥子'.includes(z[1])?wx.水++:0;
                });
                let chartHtml = `<div class="bg-darker p-6 rounded-xl text-center mb-6"><h4 class="text-xl font-bold mb-4 text-gradient">八字排盘</h4><div class="grid grid-cols-4 gap-4"><div class="p-3 bg-primary/20 rounded-lg"><p>年柱</p><p class="text-2xl">${yearZhu}</p><p class="text-xs">${naYin[0]}</p></div><div class="p-3 bg-primary/20 rounded-lg"><p>月柱</p><p class="text-2xl">${monthZhu}</p><p class="text-xs">${naYin[1]}</p></div><div class="p-3 bg-primary/20 rounded-lg"><p>日柱</p><p class="text-2xl">${dayZhu}</p><p class="text-xs">${naYin[2]}</p></div><div class="p-3 bg-primary/20 rounded-lg"><p>时柱</p><p class="text-2xl">${shiZhu}</p><p class="text-xs">${naYin[3]}</p></div></div><p class="mt-4">日主：${riGan}（${gender==='male'?'男':'女'}）</p></div>`;
                let analysisHtml = `<div class="space-y-4"><div class="bg-darker/30 p-4 rounded-lg"><h5 class="font-bold text-primary mb-2">五行力量</h5><p>木${wx.木} 火${wx.火} 土${wx.土} 金${wx.金} 水${wx.水}</p></div><div class="bg-darker/30 p-4 rounded-lg"><h5 class="font-bold text-primary mb-2">纳音</h5><p>年：${naYin[0]} 月：${naYin[1]} 日：${naYin[2]} 时：${naYin[3]}</p></div></div><p class="text-yellow-300 text-sm mt-6">八字命理仅供娱乐参考</p>`;
                document.getElementById('bazi-chart').innerHTML = chartHtml;
                document.getElementById('bazi-analysis').innerHTML = analysisHtml;
                document.getElementById('bazi-result').classList.remove('hidden');
            } catch(e) { alert('八字排盘出错：' + e.message); }
        }
        function calculateBaziHepan() {
            const date1 = document.getElementById('hepan1-date').value;
            const date2 = document.getElementById('hepan2-date').value;
            if (!date1 || !date2) { alert('请选择出生日期'); return; }
            const [y1,m1,d1] = date1.split('-').map(Number);
            const [y2,m2,d2] = date2.split('-').map(Number);
            const h1 = document.getElementById('hepan1-time').value ? parseInt(document.getElementById('hepan1-time').value.split(':')[0]) : 12;
            const h2 = document.getElementById('hepan2-time').value ? parseInt(document.getElementById('hepan2-time').value.split(':')[0]) : 12;
            const bazi1 = Solar.fromYmd(y1,m1,d1).getLunar().getEightChar();
            const bazi2 = Solar.fromYmd(y2,m2,d2).getLunar().getEightChar();
            const dz1 = bazi1.getDay(); const dz2 = bazi2.getDay();
            let score = 60;
            if (dz1.charAt(0) === dz2.charAt(0)) score += 10;
            if (['子丑','寅亥','卯戌','辰酉','巳申','午未'].includes(dz1.charAt(1)+dz2.charAt(1)) || ['子丑','寅亥','卯戌','辰酉','巳申','午未'].includes(dz2.charAt(1)+dz1.charAt(1))) score += 10;
            score = Math.min(score, 100);
            let level = score>=90?'天作之合':score>=75?'非常合适':score>=60?'比较合适':'一般';
            document.getElementById('bazi-hepan-score').innerHTML = `<div class="inline-block p-8 bg-gradient-to-br from-primary/20 to-accent/20 rounded-full"><p class="text-6xl font-bold text-gradient">${score}</p><p class="text-xl mt-2">${level}</p></div>`;
            document.getElementById('bazi-hepan-analysis').innerHTML = `<div class="space-y-4"><div class="bg-darker/30 p-4 rounded-lg"><h5 class="font-bold text-primary mb-2">合盘分析</h5><p>${level}</p></div></div>`;
            document.getElementById('bazi-hepan-result').classList.remove('hidden');
        }

        // 六爻（完整卦辞）
        let yaoCount = 0, yaoList = [], isAnimating = false;
        function tossCoins() {
            if (yaoCount >= 6 || isAnimating) return;
            isAnimating = true;
            const coins = [document.getElementById('coin1'), document.getElementById('coin2'), document.getElementById('coin3')];
            coins.forEach(c => { c.classList.remove('flipped'); c.querySelector('.coin-text').innerHTML = '⚊'; });
            const results = coins.map(() => Math.random() < 0.5 ? '⚊' : '⚋');
            coins.forEach((c, i) => { setTimeout(() => { c.classList.add('flipped'); }, i * 100); });
            setTimeout(() => {
                coins.forEach((c, i) => { c.querySelector('.coin-text').innerHTML = results[i]; });
                const yangCount = results.filter(r => r === '⚊').length;
                let yao, isMoving;
                if (yangCount === 0) { yao = 0; isMoving = true; }
                else if (yangCount === 1) { yao = 1; isMoving = false; }
                else if (yangCount === 2) { yao = 0; isMoving = false; }
                else { yao = 1; isMoving = true; }
                yaoList.push({ yao, isMoving });
                yaoCount++;
                document.getElementById('yao-count').innerText = yaoCount;
                if (yaoCount === 6) renderGua();
                isAnimating = false;
            }, 1500);
        }
        function renderGua() {
            const benGua = [], bianGua = [];
            for (let i = 0; i < 6; i++) {
                benGua.push(yaoList[i].yao);

        // 梅花易数（修复文字起卦）
        function calculateMeihua() {
            const method = document.getElementById('meihua-method').value;
            let n1, n2;
            if (method === 'number') {
                n1 = parseInt(document.getElementById('num1').value) || 1;
                n2 = parseInt(document.getElementById('num2').value) || 1;
            } else if (method === 'time') {
                const now = new Date();
                n1 = now.getHours();
                n2 = now.getMinutes();
            } else if (method === 'text') {
                const text = document.getElementById('meihua-text').value || '测试';
                n1 = getTextStrokes(text);
                n2 = text.length;
            }
            const shangGua = n1 % 8 === 0 ? 8 : n1 % 8;
            const xiaGua = n2 % 8 === 0 ? 8 : n2 % 8;
            const bianYao = (n1 + n2) % 6 === 0 ? 6 : (n1 + n2) % 6;
            const guaNames = ['坤','艮','坎','巽','震','离','兑','乾'];
            const benGuaName = guaNames[shangGua-1] + '为' + guaNames[xiaGua-1];
            const shangYao = (shangGua-1).toString(2).padStart(3,'0').split('').map(Number);
            const xiaYao = (xiaGua-1).toString(2).padStart(3,'0').split('').map(Number);
            const benYao = [...shangYao, ...xiaYao];
            benYao[bianYao-1] = benYao[bianYao-1] === 0 ? 1 : 0;
            const newShang = parseInt(benYao.slice(0,3).join(''),2);
            const newXia = parseInt(benYao.slice(3).join(''),2);
            const bianGuaName = guaNames[newShang] + '为' + guaNames[newXia];
            document.getElementById('meihua-chart').innerHTML = `<div class="bg-darker p-6 rounded-xl inline-block"><h4 class="text-xl font-bold mb-2">本卦：${benGuaName}</h4><h4 class="text-xl font-bold">变卦：${bianGuaName}</h4><p class="mt-2 text-sm text-gray-400">动爻：第${bianYao}爻</p></div>`;
            document.getElementById('meihua-interpretation').innerHTML = `<p class="mb-4">本卦为${benGuaName}，变卦为${bianGuaName}，动爻在第${bianYao}爻。</p><p>卦象显示：运势上扬，有贵人相助，宜积极进取。</p><p class="text-yellow-300 text-sm mt-4">梅花易数仅供娱乐参考</p>`;
            document.getElementById('meihua-result').classList.remove('hidden');
        }
